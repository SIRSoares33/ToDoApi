services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DatabaseConnection=Host=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - JWT:Key=${JWT_KEY}
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: